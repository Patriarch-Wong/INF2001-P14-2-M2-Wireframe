<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambulance Services WMS – Wireframe Prototype</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#111;background:#ececec}
body.drawer-open{padding-right:410px}
h1{font-size:20px;margin:0 0 2px}
h2{font-size:16px;margin:0 0 8px}
h3{font-size:14px;margin:12px 0 6px}
small,.sm{font-size:12px;color:#444}
code{background:#eee;padding:0 4px;border:1px solid #ccc}
a{color:#111}

/* prototype-only controls */
#protobar{background:#333;color:#fff;padding:6px 12px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px;position:sticky;top:0;z-index:30}
#protobar .lbl{font-weight:700;letter-spacing:.05em;border:1px dashed #bbb;padding:2px 6px}
#protobar button,#protobar select{font:inherit;padding:3px 8px;border:1px solid #999;background:#555;color:#fff;cursor:pointer;max-width:260px}
#protobar button.on{background:#fff;color:#000}
#protobar .sp{flex:1}
body.shot #protobar,body.shot #drawer{display:none}
body.shot{padding-right:0!important}

/* system frame */
#app{max-width:1280px;margin:12px auto;background:#fff;border:2px solid #222}
#hdr{border-bottom:2px solid #222;padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
#hdr .sys{font-weight:700}
#hdr nav{display:flex;gap:4px;flex-wrap:wrap}
#hdr nav a{padding:5px 10px;border:1px solid #222;text-decoration:none;background:#fff}
#hdr nav a.on{background:#222;color:#fff}
#hdr .who{margin-left:auto;font-size:12px;color:#333}
#main{padding:14px}
.phead{border-bottom:1px solid #999;padding-bottom:8px;margin-bottom:12px}
.phead .meta{font-size:12px;color:#444}
.tabs{display:flex;gap:4px;margin:0 0 12px}
.tabs a{padding:5px 12px;border:1px solid #222;text-decoration:none;background:#fff}
.tabs a.on{background:#222;color:#fff}

.btn{font:inherit;padding:4px 10px;border:1px solid #222;background:#fff;cursor:pointer;margin:1px 2px 1px 0}
.btn:hover{background:#eee}
.btn.pri{background:#222;color:#fff}
.btn.pri:hover{background:#000}
.btn[disabled]{opacity:.45;cursor:not-allowed}
select,input,textarea{font:inherit;padding:4px 6px;border:1px solid #222;background:#fff}
textarea{width:100%;min-height:70px}

.box{border:1px solid #222;padding:10px 12px;margin:0 0 12px;background:#fff}
.box.dash{border-style:dashed;background:#fafafa}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.bar .sp{flex:1}

table.t{border-collapse:collapse;width:100%}
table.t th,table.t td{border:1px solid #777;padding:4px 7px;text-align:left;vertical-align:top}
table.t th{background:#e6e6e6;font-weight:600}
table.t tr.sel td{background:#f0f0f0;outline:2px solid #222;outline-offset:-2px}
table.t tr.over td{background:#f6dede}
table.t tr.muted td{color:#888}
table.t tr.hi td{background:#eef3e6}
.scroll{max-height:460px;overflow:auto;border:1px solid #777}
.scroll table.t th{position:sticky;top:0;box-shadow:0 -1px 0 #777}
table.kv td{padding:2px 10px 2px 0;vertical-align:top}
table.kv td:first-child{color:#444;white-space:nowrap}

.tag{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border:1px solid #222;background:#fff;white-space:nowrap}
.tag.dark{background:#222;color:#fff}
.tag.red{border-color:#a00;color:#a00}
.tag.grey{border-color:#888;color:#666}
.need{font-weight:700;color:#a00;border:1px dashed #a00;padding:0 5px;white-space:nowrap}
.pend{font-weight:700;border:1px dashed #222;padding:0 5px;white-space:nowrap}

.flash{border:1px solid #222;border-left-width:8px;padding:8px 10px;margin:0 0 12px;background:#f7f7f7}
.flash.err,.flash.warn{border-color:#a00}
.flash.err b:first-child,.flash.warn b:first-child{color:#a00}
.note{border:1px solid #777;border-left-width:6px;padding:6px 10px;margin:0 0 10px;background:#fafafa}
.note.red{border-color:#a00}

/* roster grid */
table.grid{border-collapse:collapse;width:100%;table-layout:fixed}
table.grid th,table.grid td{border:1px solid #777;padding:2px;text-align:center;font-size:12px}
table.grid th{background:#e6e6e6}
.cell{font:inherit;font-size:12px;width:100%;min-height:50px;border:1px solid transparent;background:#fff;cursor:pointer;padding:3px}
.cell:hover{background:#eee}
.cell.sel{background:#222;color:#fff}
.cell.sel small{color:#ddd}
.cell.short{border:1px dashed #a00}
.cell.short b{color:#a00}
.cell.sel.short b{color:#fff}

/* candidates */
.cands{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cand{border:1px solid #222;padding:8px}
.cand h4{margin:0 0 4px;font-size:14px}
table.av{border-collapse:collapse;font-size:11px;margin:2px 0}
table.av th,table.av td{border:1px solid #999;padding:1px 4px;text-align:center}
table.av td.y{background:#ddd;font-weight:700}
table.av td.a{background:#222;color:#fff}
table.av td.cur{outline:2px solid #a00;outline-offset:-2px}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 14px}
.fld span.l{display:block;font-size:12px;color:#333;margin-bottom:2px}
.fld input:not([type=checkbox]):not([type=radio]),.fld select{width:100%}
.fld.bad input,.fld.bad select,.fld.bad .cks{border:2px solid #a00}
.fld em{display:block;color:#a00;font-size:12px;font-style:normal;font-weight:700}
.cks{padding:4px;border:1px solid transparent}
.ck{display:inline-block;margin-right:12px;white-space:nowrap}

/* staff */
.card{border:1px solid #222;padding:10px;margin:0 0 10px}
.card .top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.wk{border:1px solid #222}
.wk h3{margin:0;padding:5px 8px;background:#e6e6e6;border-bottom:1px solid #222}
.wk table{width:100%;border-collapse:collapse}
.wk td,.wk th{border-top:1px solid #bbb;padding:3px 8px;text-align:left;font-size:13px}
.wk td:first-child{white-space:nowrap}
.cal{border-collapse:collapse;width:100%;table-layout:fixed}
.cal th,.cal td{border:1px solid #777;padding:3px;vertical-align:top;font-size:12px}
.cal th{background:#e6e6e6}
.cal td{height:74px}
.cal td.out{background:#f1f1f1;color:#999}
.cal .s{border:1px solid #222;padding:1px 3px;margin-top:2px;background:#eee;overflow-wrap:anywhere}
.hbar{display:inline-block;height:10px;background:#555;vertical-align:middle}
.hbar.o{background:#a00}

/* drawer (prototype-only) */
#drawer{display:none;position:fixed;top:0;right:0;bottom:0;width:400px;background:#fafafa;border-left:3px solid #222;z-index:40;overflow:auto;padding:10px 12px;font-size:12.5px}
body.drawer-open #drawer{display:block}
#drawer h2{font-size:14px}
#drawer .uc{font-weight:700;margin:12px 0 3px;border-bottom:1px solid #222}
#drawer .sc{border:1px solid #bbb;padding:5px 6px;margin:4px 0;background:#fff}
#drawer .sc.on{border:2px solid #222}
#drawer .sc .cap{margin-top:4px;padding:4px 6px;background:#eee}
#drawer .msg{border:1px solid #999;padding:5px 6px;margin:5px 0;background:#fff}

/* modal */
#modal .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:90px 12px}
#modal .mbox{background:#fff;border:2px solid #222;max-width:540px;width:100%;padding:14px}
#modal .mbox h2{border-bottom:1px solid #999;padding-bottom:6px}
#modal .merr{color:#a00;font-weight:700;margin:6px 0}

/* figure annotation (screenshots only): outlines what a scenario step produced */
.hl{position:absolute;border:4px solid #ff6a00;border-radius:5px;box-shadow:0 0 0 3px rgba(255,196,0,.6);pointer-events:none;z-index:60}

@media (max-width:760px){
  .cands{grid-template-columns:1fr}
  .cal th,.cal td{font-size:10px;padding:2px}
  .cal .s{padding:1px}
  #hdr .who{margin-left:0}
  body.drawer-open{padding-right:0}
  #drawer{width:100%}
}
</style>

<body>
<div id="protobar"></div>
<div id="app"><header id="hdr"></header><main id="main"></main></div>
<aside id="drawer"></aside>
<div id="modal"></div>

<script>
'use strict';
/* =====================================================================
   Ambulance Services Workload Management System – interactive wireframe
   Pages = boundary classes of the class diagram:
     UserAccountPage, StaffPlanningPage, RosterManagementPage,
     ManagerDashboardPage, StaffRosterPage, MonthlyAssignmentView, FleetPage
   Database, SMS Service and audit log are simulated in memory.
   ===================================================================== */

/* ---------- constants & assumptions ---------- */
const CONFIG = {drivers:17, careAssistants:20, paramedics:36, ambulances:10};
const NOW = new Date(2026,10,20,10,0);          // simulated "today": Fri 20 Nov 2026, 10:00
const STATION = 'Central Station';              // single-station assumption
const ROLES = {driver:'Driver', careAssistant:'Care Assistant', paramedic:'Paramedic'};
const POS = ['driver','careAssistant','paramedic','paramedic'];
const POSLBL = ['Driver','Care Assistant','Paramedic 1','Paramedic 2'];
const HIST = ['2026-10-26','2026-11-02','2026-11-09'];
const CUR = '2026-11-16';
const PLAN = ['2026-11-23','2026-11-30','2026-12-07','2026-12-14','2026-12-21']; // five-week planning period
const MGR = 'M2001';
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MIN_AMB = 6, MAX_HOURS = 40;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const fmtD = s => { const d = parse(s); return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; };
const fmtShort = s => { const d = parse(s); return d.getDate()+' '+MON[d.getMonth()]; };
const weekLbl = w => fmtShort(w)+' – '+fmtShort(addDays(w,6))+' '+parse(addDays(w,6)).getFullYear();
const monthLbl = ym => MON[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
const dayNum = s => { const [y,m,d] = s.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
const sDate = sh => sh.slice(0,10), sType = sh => sh.slice(11);
const gIdx = sh => dayNum(sDate(sh))*2 + (sType(sh)==='N'?1:0);
const sStart = sh => { const d = parse(sDate(sh)); d.setHours(sType(sh)==='D'?7:19); return d; };
const started = sh => sStart(sh) <= NOW;
const sTimes = sh => sType(sh)==='D' ? '07:00–19:00' : '19:00–07:00';
const sName = sh => sType(sh)==='D' ? 'Day' : 'Night';
const sLbl = sh => fmtD(sDate(sh))+' · '+sName(sh)+' shift';
const weekOf = sh => { const d = parse(sDate(sh)); return addDays(sDate(sh), -((d.getDay()+6)%7)); };
const weekShifts = w => { const o=[]; for(let i=0;i<7;i++) o.push(addDays(w,i)+'|D', addDays(w,i)+'|N'); return o; };
const sid = (w,day,t) => addDays(w,day)+'|'+t;
const cutoff = w => addDays(w,-5);                           // Wednesday before the roster week
const isLate = w => parse(addDays(cutoff(w),1)) <= NOW;      // cut-off day has fully passed
const btn = (label,act,data={},cls='',dis=false) => `<button class="btn ${cls}" data-act="${act}" ${Object.entries(data).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ')} ${dis?'disabled':''}>${label}</button>`;
const opt = (v,l,sel) => `<option value="${esc(v)}" ${sel?'selected':''}>${esc(l)}</option>`;
const tag = (t,c='') => `<span class="tag ${c}">${t}</span>`;

/* ---------- state ---------- */
let S, UI, seq = 0, clock = 0, skipHash = 0;
const nid = p => p+(++seq);
const stamp = () => { const d = new Date(NOW.getTime()+(clock++)*60000); return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()+', '+pad(d.getHours())+':'+pad(d.getMinutes()); };
const user = id => S.users.find(u => u.id===id);
const amb = no => S.ambulances.find(a => a.no===no);
const uname = id => { const u = user(id); return u ? u.name : id; };
const qual = u => u.type==='manager' ? 'Manager' : u.roles.map(r=>ROLES[r]).join(', ');
const route = () => (location.hash || '#/manager/dashboard').slice(2).split('/');
function actor(){ const r = route()[0]; return r==='it' ? 'Kelvin Ong (IT Administrator)' : r==='staff' ? uname(UI.staffId)+' (Staff '+UI.staffId+')' : uname(MGR)+' (Manager '+MGR+')'; }
function audit(action,prev,next,reason,who,when){ S.audit.unshift({t:when||stamp(), who:who||actor(), action, prev:prev||'—', next:next||'—', reason:reason||'—'}); }
function sms(to,topic,text,when){ const u = user(to); S.sms.unshift({t:when||stamp(), to, name:u.name, contact:u.contact, topic, text}); }
function flash(type,html){ UI.flash = {type,html}; }

function freshRos(w){ return {week:w||PLAN[0], shift:null, slot:null, cand:null, pubFail:null, ambPick:null, created:null}; }
function freshUI(){ return {
  drawer:null, staffId:'S1038', flash:null, modal:null, sc:null, scStep:0,
  acc:{mode:null, form:null, err:null, orig:null, hi:null},
  dash:{week:CUR, monthly:false, month:'2026-11', uWeek:CUR, uDay:''},
  ros:freshRos(PLAN[0]),
  fleet:{form:null, unav:null, affected:null},
  sr:{week:CUR}, mon:{month:'2026-11'},
  plan:{for:null, draft:null, prefWeek:PLAN[1]}
}; }

/* ---------- roster queries (control-layer logic) ---------- */
function slotById(id){ for(const [week,roster] of Object.entries(S.rosters)){ const slot = roster.slots.find(x=>x.id===id); if(slot) return {slot,roster,week}; } return null; }
function staffAsgs(staffId){ const out=[]; for(const [week,roster] of Object.entries(S.rosters)) for(const slot of roster.slots) for(const asg of slot.asg) if(asg.staffId===staffId) out.push({slot,asg,week,roster}); return out; }
function hoursWeek(staffId,w,withPending){ const r = S.rosters[w]; if(!r) return 0; let h=0; for(const sl of r.slots) for(const a of sl.asg) if(a.staffId===staffId && (withPending||a.status==='confirmed')) h+=12; return h; }
function hoursMonth(staffId,ym,publishedOnly){ let h=0; for(const r of Object.values(S.rosters)){ if(publishedOnly && r.status!=='published') continue; for(const sl of r.slots) if(sl.shiftId.startsWith(ym)) for(const a of sl.asg) if(a.staffId===staffId && a.status==='confirmed') h+=12; } return h; }
function positions(slot){ const pos = POS.map((role,i)=>({role,i,asg:null})); for(const a of slot.asg) for(const r of a.roles){ const p = pos.find(p=>p.role===r && !p.asg); if(p) p.asg=a; } return pos; }
const ambOk = slot => { if(!slot.amb) return false; const a = amb(slot.amb); return !!a && a.status==='active' && !a.unavail.includes(slot.shiftId); };
// a role counts as filled only by a confirmed, active staff member who is recorded as qualified for it (FR-08, FR-12, FR-18)
// (shifts that have already started are historical records and are left as they were)
const posOk = (p,past) => { if(!p.asg || p.asg.status!=='confirmed') return false; const u = user(p.asg.staffId); return past || (u.status==='active' && u.roles.includes(p.role)); };
const missing = slot => { const past = started(slot.shiftId); return positions(slot).filter(p => !posOk(p,past)); };
const fully = slot => ambOk(slot) && missing(slot).length===0;                 // "fully staffed and available"
const shiftSlots = (w,sh) => S.rosters[w] ? S.rosters[w].slots.filter(s=>s.shiftId===sh) : [];
const fullCount = (w,sh) => shiftSlots(w,sh).filter(fully).length;
const slotNo = slot => shiftSlots(weekOf(slot.shiftId),slot.shiftId).indexOf(slot)+1;
const missTxt = slot => { const m = missing(slot), c = {}; m.forEach(p=>c[p.role]=(c[p.role]||0)+1); return Object.entries(c).map(([r,n])=>ROLES[r]+' ×'+n).join(', '); };
const isAvail = (id,sh) => !!(S.avail[id] && S.avail[id][sh]);
// FR-02 / BR-DOC-16: declared availability for a shift, visible to the manager across the planning period
function availCount(sh){ const busy = new Set(); for(const s of shiftSlots(weekOf(sh),sh)) for(const a of s.asg) busy.add(a.staffId);
  const free = S.users.filter(u => u.type==='staff' && u.status==='active' && isAvail(u.id,sh) && !busy.has(u.id)), o = {total:free.length};
  Object.keys(ROLES).forEach(r => { o[r] = free.filter(u => u.roles.includes(r)).length; }); return o; }
const inWindow = d => d >= iso(NOW) && d <= addDays(PLAN[4],6);          // NFR-06: staff location only for dates within the five-week planning window
function eligibleAmbs(slot){ const used = new Set(shiftSlots(weekOf(slot.shiftId),slot.shiftId).filter(s=>s!==slot && s.amb).map(s=>s.amb)); return S.ambulances.filter(a => a.status==='active' && !a.unavail.includes(slot.shiftId) && !used.has(a.no)); }

/* assignment rules: qualification (FR-08), same-shift (FR-09), 12-hour rest (FR-10), 40-hour warning (FR-11) */
function validate(staffId,slot,roles){
  const u = user(staffId), errs = [], g = gIdx(slot.shiftId);
  if(u.status!=='active') errs.push(`${u.name}'s account has been deactivated, so they can no longer be assigned.`);
  roles.forEach(r => { if(!u.roles.includes(r)) errs.push(`Qualification rule: ${u.name} is not recorded as qualified for the ${ROLES[r]} role.`); });
  for(const x of staffAsgs(staffId)){
    const d = gIdx(x.slot.shiftId)-g;
    if(d===0) errs.push(`Same-shift rule: ${u.name} is already assigned in this shift (Slot ${slotNo(x.slot)}, ${x.slot.amb||'no ambulance'}).`);
    else if(Math.abs(d)===1) errs.push(`12-hour rest rule: ${u.name} is assigned to ${sLbl(x.slot.shiftId)}, which would leave less than 12 hours of rest.`);
  }
  const h = hoursWeek(staffId, weekOf(slot.shiftId), true);
  return {errs, warn: !errs.length && h+12 > MAX_HOURS ? {from:h, to:h+12} : null};
}
/* suitable / eligible standby candidates: active, qualified, declared available, not assigned that shift, >= 12 h rest */
function suitable(slot,role){
  const w = weekOf(slot.shiftId);
  return S.users.filter(u => u.type==='staff' && u.status==='active' && u.roles.includes(role) && isAvail(u.id,slot.shiftId) && !(slot.excl||[]).includes(u.id) && !validate(u.id,slot,[role]).errs.length)
    .sort((a,b) => hoursWeek(a.id,w,true)-hoursWeek(b.id,w,true) || a.name.localeCompare(b.name));
}

/* ---------- seed data (simulated Database) ---------- */
const FIRST = ['Aisha','Ben','Chloe','Darren','Elena','Farid','Grace','Hafiz','Irene','Jason','Kavita','Liam','Mei Ling','Nabil','Olivia','Prakash','Qistina','Ryan','Siti','Tom','Uma','Victor','Wei Jie','Xin Yi','Yusuf','Zara','Arjun','Bella','Caleb','Devi','Ethan','Fiona','Gopal','Hannah','Imran','Joy','Kumar'];
const LAST = ['Tan','Lim','Rahman','Singh','Lee','Ng','Ibrahim','Nair','Wong','Chua','Hassan','Pillai','Goh','Teo','Ismail','Menon','Koh','Yeo','Osman','Raj'];
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function seed(){
  seq = 0; clock = 0;
  const users = []; let n = 0;
  const mk = roles => { const i = n++; const ph = String((i*104729+1234567)%10000000).padStart(7,'0');
    users.push({id:'S'+(1001+i), type:'staff', name:FIRST[i%FIRST.length]+' '+LAST[(i*3)%LAST.length], roles, contact:'+65 8'+ph.slice(0,3)+' '+ph.slice(3), start:(2015+i%10)+'-'+pad(1+(i*5)%12)+'-01', status:'active'}); };
  for(let k=0;k<CONFIG.drivers;k++) mk(['driver','careAssistant']);   // conflict C3: all current drivers are recorded as care-assistant qualified
  for(let k=0;k<CONFIG.careAssistants;k++) mk(['careAssistant']);
  for(let k=0;k<CONFIG.paramedics;k++) mk(['paramedic']);
  users.push({id:'M2001', type:'manager', name:'Farah Aziz', roles:[], contact:'+65 9000 1001', start:'2016-03-01', status:'active'});
  users.push({id:'M2002', type:'manager', name:'Daniel Koh', roles:[], contact:'+65 9000 1002', start:'2018-07-01', status:'active'});
  S = {users, ambulances:[], rosters:{}, avail:{}, late:{}, prefs:{}, sms:[], audit:[]};
  for(let a=1;a<=CONFIG.ambulances;a++) S.ambulances.push({no:'A'+pad(a), status:'active', unavail:[]});

  const D = users.slice(0,CONFIG.drivers).map(u=>u.id);
  const C = users.slice(CONFIG.drivers, CONFIG.drivers+CONFIG.careAssistants).map(u=>u.id);
  const P = users.slice(CONFIG.drivers+CONFIG.careAssistants, n).map(u=>u.id);
  const me = P[0];
  // Base rota: each crew works three consecutive days then three consecutive nights, then rests.
  // The pattern guarantees no same-shift clash and at least 12 hours of rest between shifts.
  const t0 = dayNum(HIST[0]);
  const crew = (pool,k,s,sh) => { const len = pool.length, t = dayNum(sDate(sh))-t0, a = (((-s*t)%len)+len)%len, off = sType(sh)==='N'?k:0; return Array.from({length:k},(_,x) => pool[(a+off+x)%len]); };
  const A = (id,role) => ({id:nid('AS'), staffId:id, roles:[role], status:'confirmed'});
  [...HIST,CUR,PLAN[0]].forEach((w,wi) => { const slots = [];
    weekShifts(w).forEach(sh => { const d = crew(D,6,2,sh), c = crew(C,6,2,sh), p = crew(P,12,4,sh);
      for(let a=0;a<MIN_AMB;a++) slots.push({id:nid('SL'), shiftId:sh, amb:'A'+pad(a+1), asg:[A(d[a],'driver'),A(c[a],'careAssistant'),A(p[2*a],'paramedic'),A(p[2*a+1],'paramedic')]}); });
    S.rosters[w] = {status: wi<4 ? 'published' : 'draft', slots}; });

  // Demo-specific adjustments, made with the same rule checks the system uses.
  const fixed = new Set([me,C[19],P[35],D[16],P[34],P[33],C[18],D[15]]);
  const poolOf = id => D.includes(id) ? D : C.includes(id) ? C : P;
  const freeFor = (slot,role,from) => { const w = weekOf(slot.shiftId); return from.filter(id => !fixed.has(id) && !validate(id,slot,[role]).errs.length).sort((a,b) => hoursWeek(a,w)-hoursWeek(b,w) || from.indexOf(a)-from.indexOf(b))[0]; };
  function setPattern(id,w,idxs){
    const role = user(id).roles[0], sh = weekShifts(w), keep = idxs.map(x => sh[x]);
    S.rosters[w].slots.forEach(sl => sl.asg.forEach(a => { if(a.staffId!==id || keep.includes(sl.shiftId)) return;
      a.staffId = '__'; const sub = freeFor(sl,role,poolOf(id)); if(!sub) console.error('seed: no substitute', w, sl.shiftId); a.staffId = sub; }));
    keep.forEach(x => { if(staffAsgs(id).some(y => y.slot.shiftId===x)) return;
      const sl = shiftSlots(w,x)[0], a = sl.asg.find(y => y.roles[0]===role && !fixed.has(y.staffId));
      if(validate(id,sl,[role]).errs.length) console.error('seed: pattern breaks a rule', id, x); a.staffId = id; });
  }
  // Sat 21 Nov Night runs a seventh ambulance
  { const sl = {id:nid('SL'), shiftId:sid(CUR,5,'N'), amb:'A07', asg:[]}; S.rosters[CUR].slots.push(sl);
    [['driver',D],['careAssistant',C],['paramedic',P],['paramedic',P]].forEach(([r,pl]) => sl.asg.push(A(freeFor(sl,r,pl),r))); }
  [[C[19],CUR,[]],[P[35],CUR,[2]],[D[16],CUR,[0,4]],[me,CUR,[1,5,9,11]],
   [P[34],PLAN[0],[6]],[P[33],PLAN[0],[4,10]],[C[18],PLAN[0],[3,8]],[D[15],PLAN[0],[5,11]],[me,PLAN[0],[2,5,9,12]]].forEach(x => setPattern(...x));

  // draft week: one Paramedic role still requires manpower (Mon 23 Nov Day, last slot)
  { const sl = shiftSlots(PLAN[0], sid(PLAN[0],0,'D'))[5]; sl.asg.pop(); }
  // current week: a paramedic rejected Sun 22 Nov Night; a standby request to the demo staff member is pending
  { const sl = shiftSlots(CUR, sid(CUR,6,'N'))[3]; const old = sl.asg.pop(); sl.excl = [old.staffId];
    sl.asg.push({id:nid('AS'), staffId:me, roles:['paramedic'], status:'pending'});
    const t1='19 Nov 2026, 16:05', t2='19 Nov 2026, 16:20', where=`${sLbl(sl.shiftId)}, Slot 4 (${sl.amb})`;
    audit('Assignment rejected by staff', `${uname(old.staffId)} – Paramedic, ${where}`, 'Role unassigned', 'Medical appointment', uname(old.staffId)+' (Staff '+old.staffId+')', t1);
    sms(MGR,'Assignment rejected', `${uname(old.staffId)} rejected Paramedic, ${where}. Reason: Medical appointment. Shift now has 5 of 6 fully staffed ambulances.`, t1);
    audit('Standby replacement requested (pending confirmation)', 'Role unassigned', `${uname(me)} – Paramedic, ${where}`, '—', uname(MGR)+' (Manager '+MGR+')', t2);
    sms(me,'Replacement offer', `You have been selected as standby replacement: Paramedic, ${where}, ${sTimes(sl.shiftId)}, ${STATION}. Please confirm or decline in the system.`, t2);
  }
  // fleet
  amb('A09').status = 'deactivated';
  amb('A10').unavail.push(sid(PLAN[0],6,'D'), sid(PLAN[0],6,'N'));
  amb('A07').unavail.push(sid(PLAN[0],6,'N'));
  amb('A08').unavail.push(sid(PLAN[0],6,'N'));

  // availability & preferences
  const rnd = mulberry(42), assigned = {};
  for(const r of Object.values(S.rosters)) for(const sl of r.slots) for(const a of sl.asg) (assigned[a.staffId]||(assigned[a.staffId]=new Set())).add(sl.shiftId);
  const special = [C[19],P[35],D[16],P[34],P[33],C[18],D[15]];
  users.filter(u=>u.type==='staff').forEach(u => {
    const av = S.avail[u.id] = {}, as = assigned[u.id] || new Set();
    [CUR,PLAN[0]].forEach(w => weekShifts(w).forEach(sh => { const r = rnd(); if(as.has(sh) || r<0.85 || special.includes(u.id)) av[sh]=true; }));
    weekShifts(PLAN[1]).forEach(sh => { if(rnd()<0.35) av[sh]=true; });
    S.prefs[u.id] = {};
    [CUR,PLAN[0],PLAN[1]].forEach(w => { const r = rnd(), st = rnd()<0.6; const shiftType = r<0.35?'day':r<0.7?'night':''; if(shiftType||st) S.prefs[u.id][w] = {shiftType, station:st}; });
  });
  // Sun 22 Nov Day: no rested driver has declared availability (drives "no suitable candidate" scenarios)
  { const sh = sid(CUR,6,'D'); D.forEach(id => { if(!(assigned[id]||new Set()).has(sh)) delete S.avail[id][sh]; }); }
  S.avail[me][sid(CUR,6,'N')] = true;
  delete S.prefs[me][PLAN[1]]; S.prefs[me][PLAN[0]] = {shiftType:'night', station:true};
  [C[3],P[10],D[8]].forEach(id => { S.late[id] = {[PLAN[0]]:true}; });
  S.demo = {D,C,P,me};
}

function createDraft(w){
  const slots = []; weekShifts(w).forEach(sh => { for(let i=0;i<MIN_AMB;i++) slots.push({id:nid('SL'), shiftId:sh, amb:null, asg:[]}); });
  S.rosters[w] = {status:'draft', slots};
  audit('Draft roster created', '—', 'Empty draft roster, week '+weekLbl(w));
}
function crewCell(p,past){
  if(past && p.asg) return esc(uname(p.asg.staffId))+(p.asg.roles.length>1 ? ' <small>(dual role)</small>' : '');
  const a = p.asg; if(!a) return '<span class="need">REQUIRES MANPOWER</span>';
  const u = user(a.staffId), dual = a.roles.length>1 ? ' <small>(dual role)</small>' : '', off = u.status!=='active' ? '<br>'+tag('ACCOUNT DEACTIVATED','red') : !u.roles.includes(p.role) ? '<br>'+tag('NOT QUALIFIED','red') : '';
  return a.status==='pending' ? `<span class="pend">AWAITING CONFIRMATION</span><br>${esc(u.name)}` : esc(u.name)+dual+off;
}
function pgRoster(){
  const R = UI.ros, w = R.week;
  if(!S.rosters[w]){ createDraft(w); R.created = w; }                      // UC-04 step 2: create an empty draft if none exists
  const r = S.rosters[w], pub = r.status==='published', shifts = weekShifts(w);
  if(!R.shift || weekOf(R.shift)!==w){ R.shift = shifts.find(sh => !started(sh)) || shifts[0]; R.slot = null; R.cand = null; }
  const slots = shiftSlots(w,R.shift), sel = R.slot ? slots.find(s => s.id===R.slot) : null, locked = started(R.shift);

  let html = pageHead('Roster Management','RosterManagementPage','UC-04 Build Weekly Roster · UC-05 Publish Weekly Roster · UC-06 Amend Published Roster · UC-08 Find Standby Replacement');
  html += `<div class="bar"><label>Roster week: <select data-chg="rosWeek">${[CUR,...PLAN].map(x => { const st = S.rosters[x] ? S.rosters[x].status : 'no roster yet'; return opt(x, weekLbl(x)+(x===CUR?' (current week)':'')+' – '+st, x===w); }).join('')}</select></label>
    ${pub ? tag('PUBLISHED','dark') : tag('DRAFT')}<span class="sp"></span>
    ${pub ? '' : btn('Save draft','rosSave')+btn('Publish roster','rosPublish',{},'pri')}</div>`;

  if(R.created===w) html += `<div class="note">No draft roster existed for this week, so an empty draft roster has been created (${MIN_AMB} empty slots per shift).</div>`;
  if(pub) html += `<div class="note">This roster has been <b>published</b>. Changes to a published roster are made by amending it: select an assignment and choose <b>Reassign</b> or <b>Remove</b> (a reason is required and affected staff are notified by SMS). Unassigned roles can be filled with a <b>standby replacement</b>.</div>`;

  // flags: invalid ambulance assignments (UC-04 9a / UC-12 3b), shortfalls after publication (FR-14), deactivated staff (UC-01 1b)
  const bad = r.slots.filter(s => s.amb && !ambOk(s) && !started(s.shiftId));
  if(bad.length) html += `<div class="note red"><b>! Invalid ambulance assignment.</b> This ${pub?'published':'draft'} roster uses an ambulance that is no longer active or available:<ul style="margin:4px 0">${bad.map(s => `<li>${sLbl(s.shiftId)}, Slot ${slotNo(s)}: <b>${s.amb}</b> is unavailable ${btn('Open slot','rosOpen',{slot:s.id})}</li>`).join('')}</ul>${pub ? 'The slot is not counted as an available ambulance; amend the affected assignments.' : 'Select the slot and change its ambulance.'}</div>`;
  if(pub){
    const sf = shifts.filter(sh => !started(sh) && fullCount(w,sh) < MIN_AMB);
    if(sf.length) html += `<div class="note red"><b>! Shortfall flagged.</b> Fewer than ${MIN_AMB} fully staffed and available ambulances:<ul style="margin:4px 0">${sf.map(sh => `<li><b>${sLbl(sh)}</b>: ${fullCount(w,sh)} of ${MIN_AMB} – missing ${shiftSlots(w,sh).filter(s=>!fully(s)).map(s => `Slot ${slotNo(s)} (${s.amb}): ${missTxt(s)||'ambulance unavailable'}`).join('; ')} ${btn('Open shift','rosShift',{sh})}</li>`).join('')}</ul></div>`;
  }
  const unq = r.slots.filter(s => !started(s.shiftId) && positions(s).some(p => p.asg && user(p.asg.staffId).status==='active' && !user(p.asg.staffId).roles.includes(p.role)));
  if(unq.length) html += `<div class="note red"><b>! Qualification changed.</b> ${unq.length} slot(s) have a staff member who is no longer recorded as qualified for the assigned role. Those roles no longer count as filled. Amend them: ${unq.slice(0,6).map(s => btn(sLbl(s.shiftId)+', Slot '+slotNo(s),'rosOpen',{slot:s.id})).join(' ')}</div>`;
  const deact = r.slots.filter(s => !started(s.shiftId) && s.asg.some(a => user(a.staffId).status!=='active'));
  if(deact.length) html += `<div class="note red"><b>! Deactivated account.</b> ${deact.length} assignment(s) in this roster are held by staff whose account has been deactivated. Those roles no longer count as filled. Amend them:${deact.slice(0,6).map(s => btn(sLbl(s.shiftId)+', Slot '+slotNo(s),'rosOpen',{slot:s.id})).join(' ')}</div>`;

  if(R.pubFail) html += `<div class="flash err"><b>✕ Roster cannot be published.</b> Every shift needs at least ${MIN_AMB} fully staffed and available ambulances. The roster stays as a draft.
    <div class="scroll" style="max-height:230px;margin-top:6px"><table class="t"><tr><th>Affected shift</th><th>Fully staffed ambulances</th><th>Ambulance shortfall</th><th>Missing roles</th><th></th></tr>
    ${R.pubFail.map(f => `<tr><td>${sLbl(f.sh)}</td><td>${f.n} of ${MIN_AMB}</td><td>${MIN_AMB-f.n}</td><td>${f.detail}</td><td>${btn('Open shift','rosShift',{sh:f.sh})}</td></tr>`).join('')}</table></div></div>`;

  // week grid
  const days = [0,1,2,3,4,5,6].map(i => addDays(w,i));
  html += `<h3>Shifts in this roster week <small>(select a shift)</small></h3><table class="grid"><tr><th style="width:86px"></th>${days.map(d => `<th>${fmtD(d)}</th>`).join('')}</tr>

      return `<td><button class="cell ${sh===R.shift?'sel':''} ${fc<MIN_AMB?'short':''}" data-act="rosShift" data-sh="${sh}">${fc} fully staffed${fc<MIN_AMB?'<br><b>! below '+MIN_AMB+'</b>':''}<br><small>${started(sh)?'started':availCount(sh).total+' available'}</small></button></td>`; }).join('')}</tr>`).join('')}</table>

  const ac = availCount(R.shift);

  // slots of the selected shift
  html += `<h3>${sLbl(R.shift)} (${sTimes(R.shift)}) – roster slots <small>(one slot = one ambulance for one 12-hour shift; select a slot)</small></h3>
    ${locked ? '' : `<p class="sm" style="margin:0 0 6px"><b>Staff availability for this shift</b> (declared available, not yet assigned in it): ${ac.total} staff · qualified as Driver ${ac.driver} · Care Assistant ${ac.careAssistant} · Paramedic ${ac.paramedic}</p>`}
    <table class="t"><tr><th>Slot</th><th>Ambulance</th>${POSLBL.map(l => `<th>${l}</th>`).join('')}<th>Status</th><th></th></tr>
    ${slots.map((s,i) => { const pos = positions(s); return `<tr class="${sel===s?'sel':''}"><td>${i+1}</td><td>${s.amb ? s.amb+(ambOk(s)?'':' '+tag('UNAVAILABLE','red')) : '<span class="need">NOT SELECTED</span>'}</td>
      ${pos.map(p => `<td>${crewCell(p,locked)}</td>`).join('')}<td>${fully(s) ? tag('FULLY STAFFED','dark') : missing(s).length ? tag('REQUIRES MANPOWER','red') : tag('AMBULANCE UNAVAILABLE','red')}</td><td>${btn(sel===s?'Selected':'Select slot','rosSlot',{slot:s.id})}</td></tr>`; }).join('')}</table>
    <p>${!pub && !locked && slots.length < S.ambulances.length ? btn('+ Add slot','rosAddSlot') : ''} ${locked ? '<small>This shift has already started and is read-only.</small>' : ''}</p>`;

  if(sel) html += slotPanel(sel,pub,locked);
  return html;
}
function slotPanel(slot,pub,locked){
  const R = UI.ros, el = eligibleAmbs(slot), pos = positions(slot);
  let ambHtml;
  if(pub || locked) ambHtml = `<p><b>Ambulance:</b> ${slot.amb||'—'} ${slot.amb && !ambOk(slot) ? tag('UNAVAILABLE','red') : ''} · <b>Station:</b> ${STATION}</p>`;
  else if(!el.length && !slot.amb) ambHtml = `<div class="flash err"><b>No eligible ambulance is available for this shift.</b> All active ambulances are either unavailable for ${sLbl(slot.shiftId)} or already assigned to another roster slot in the same shift. Select another shift or roster slot.</div>`;
  else {
    const opts = el.map(a => `<label class="ck"><input type="radio" name="ambPick" data-chg="ambPick" value="${a.no}" ${R.ambPick===a.no?'checked':''}> ${a.no}</label>`).join('');
    ambHtml = `<p><b>Ambulance:</b> ${slot.amb ? slot.amb+(ambOk(slot)?'':' '+tag('UNAVAILABLE','red')) : '<span class="need">NOT SELECTED</span>'} · <b>Station:</b> ${STATION}</p>
      <div class="box dash"><b>Eligible ambulances for this shift</b> <small>(active, available for the shift, not assigned to another slot in the same shift)</small><br>
      ${opts || '<i>No other eligible ambulance.</i>'} ${slot.amb && el.length ? btn('Change ambulance','rosChangeAmb',{slot:slot.id}) : ''}
      ${slot.amb ? '' : '<br><small>Select an ambulance, then choose a crew role to fill below.</small>'}</div>`;
  }
  const rows = pos.map(p => {
    const a = p.asg; let acts = '';
    if(locked) acts = '<small>read-only</small>';
    else if(!a) acts = pub ? btn('Find standby replacement','rosStandby',{slot:slot.id,pos:p.i},'pri') : btn('Fill role','rosFill',{slot:slot.id,pos:p.i},'pri');
    else if(a.status==='pending') acts = btn('Withdraw request','rosWithdraw',{slot:slot.id,asg:a.id});
    else acts = pub ? btn('Reassign','rosReassign',{slot:slot.id,pos:p.i})+btn('Remove','rosRemovePub',{slot:slot.id,asg:a.id}) : btn('Replace','rosReplace',{slot:slot.id,pos:p.i})+btn('Remove','rosRemove',{slot:slot.id,asg:a.id});
    const extra = a && a.status==='pending' ? '<br><small>Confirmation request sent by SMS. The vacancy is not filled until the staff member confirms.</small>' : '';
    return `<tr><td>${POSLBL[p.i]}</td><td>${crewCell(p,locked)}${extra}</td><td>${acts}</td></tr>`;
  }).join('');
  return `<div class="box"><h2>Slot ${slotNo(slot)} – ${sLbl(slot.shiftId)} (${sTimes(slot.shiftId)})</h2>${ambHtml}
    <table class="t"><tr><th style="width:150px">Crew role</th><th>Assigned staff</th><th style="width:260px">Actions</th></tr>${rows}</table>
    <p class="sm">A slot is fully staffed with one driver, one care assistant and two paramedics, all confirmed. A driver who is also care-assistant qualified may cover both roles.</p></div>
    ${R.cand && R.cand.slotId===slot.id ? candPanel(slot) : ''}`;
}
function availGrid(id,w,cur){
  const as = new Set(staffAsgs(id).map(x => x.slot.shiftId));
  return `<table class="av"><tr><th></th>${[0,1,2,3,4,5,6].map(i => `<th>${DOW[parse(addDays(w,i)).getDay()]}<br>${parse(addDays(w,i)).getDate()}</th>`).join('')}</tr>
    ${['D','N'].map(t => `<tr><th>${t}</th>${[0,1,2,3,4,5,6].map(i => { const sh = sid(w,i,t); const c = as.has(sh)?'a':isAvail(id,sh)?'y':''; return `<td class="${c} ${sh===cur?'cur':''}">${as.has(sh)?'A':isAvail(id,sh)?'✓':'–'}</td>`; }).join('')}</tr>`).join('')}</table>`;
}
function candPanel(slot){
  const c = UI.ros.cand, w = weekOf(slot.shiftId), role = c.role, standby = c.mode==='standby';
  const old = c.replace ? slot.asg.find(a => a.id===c.replace) : null;
  const title = standby ? `Eligible standby candidates – ${ROLES[role]}` : c.mode==='reassign' ? `Direct reassignment – replacing ${esc(uname(old.staffId))} as ${ROLES[role]}` : `Candidates – ${ROLES[role]}${old ? ' (replacing '+esc(uname(old.staffId))+')' : ''}`;
  let html = `<div class="box" id="candPanel"><h2>${title} · Slot ${slotNo(slot)} (${slot.amb||c.amb||'—'}) · ${sLbl(slot.shiftId)}</h2>`;
  const crit = standby ? 'Eligible standby staff have declared availability for the shift, are qualified for the role, are not already assigned during the shift and would have at least 12 hours of rest between duties.'
    : 'Suitable candidates are qualified for the role, have declared availability for the shift, are not already assigned during the shift and would have at least 12 hours of rest. Lowest assigned hours first; staff who rejected or were removed from this slot are not suggested.';
  if(!c.list.length){
    html += standby ? `<div class="flash err"><b>No standby candidates are available.</b> No staff member is eligible for this role. The role remains unassigned and any shortfall below ${MIN_AMB} fully staffed ambulances stays flagged on the roster.</div>`
      : c.mode==='reassign' ? `<div class="flash err"><b>No suitable candidate is available for direct reassignment.</b> You may leave the role unassigned and look for a standby replacement. ${btn('Remove '+esc(uname(old.staffId))+' and leave role unassigned','rosRemovePub',{slot:slot.id,asg:old.id})}</div>`
      : `<div class="flash err"><b>No suitable candidate is available for this role.</b> You can look up another staff member below.</div>`;
  } else html += `<p class="sm">${c.list.length} ${standby?'eligible standby':'suitable'} candidate(s) found; up to three are shown side by side. ${crit}</p>`;
  if(standby && c.list.length) html += `<p class="sm"><b>All eligible standby staff:</b> ${c.list.map(id => `${esc(uname(id))} (${hoursWeek(id,w,true)} h)${c.shown.includes(id)?'':' '+btn('Compare','rosCandAdd',{id})}`).join(' · ')}</p>`;
  if(c.err) html += `<div class="flash err"><b>✕ Assignment not ${standby?'made':'saved'}.</b> ${c.err.errs.map(esc).join('<br>')}<br><small>Select a different candidate.</small></div>`;
  html += `<div class="cands">${c.shown.map(id => {
    const u = user(id), h = hoursWeek(id,w,true), pf = (S.prefs[id]||{})[w], late = (S.late[id]||{})[w], inList = c.list.includes(id);
    const other = role==='driver' ? 'careAssistant' : role==='careAssistant' ? 'driver' : null;
    const canDual = other && u.roles.includes(other) && positions(slot).some(p => p.role===other && (!p.asg || (c.replace && p.asg.id===c.replace)));
    return `<div class="cand"><h4>${esc(u.name)} <small>${u.id}</small></h4><div class="sm">${esc(qual(u))} ${inList?'':tag('ADDED MANUALLY','grey')} ${isAvail(id,slot.shiftId)?'':tag('AVAILABILITY NOT DECLARED','red')}</div>
      <table class="kv"><tr><td>Assigned hours (week)</td><td><b>${h} h</b> ${h>MAX_HOURS?tag('OVER 40 H','red'):''}</td></tr>
      <tr><td>Job preference</td><td>${pf ? 'Shift: '+(pf.shiftType?(pf.shiftType==='day'?'Day':'Night'):'none')+' · Station: '+(pf.station?STATION:'none') : 'No preference recorded'}</td></tr>
      <tr><td>Location on ${fmtShort(sDate(slot.shiftId))}</td><td>${!inWindow(sDate(slot.shiftId)) ? 'Not shown (outside planning window)' : isAvail(id,slot.shiftId) ? STATION : 'Not declared'}</td></tr></table>
      <div class="sm">Availability for the week ${late?tag('LATE CHANGE','red'):''}</div>${availGrid(id,w,slot.shiftId)}
      ${canDual ? `<label class="ck sm"><input type="checkbox" id="dual-${id}" value="${other}"> Also cover the ${ROLES[other]} role (dual-qualified)</label><br>` : ''}
      <p style="margin:6px 0 0">${btn('Select candidate','rosSelect',{id},'pri')} ${btn('Hide','rosCandDrop',{id})}</p></div>`; }).join('')}</div>
    <p class="sm" style="margin:6px 0">Availability key: ✓ available · – not declared · A already assigned · red outline = this shift. Location is shown only for dates within the five-week planning window. Preferences are advisory.</p>`;
  if(!standby){
    const others = S.users.filter(u => u.type==='staff' && u.status==='active' && !c.shown.includes(u.id));
    html += `<p><label>Look up another staff member to compare: <select id="candAdd">${others.map(u => opt(u.id, u.name+' ('+u.id+', '+qual(u)+')')).join('')}</select></label> ${btn('Add to comparison','rosCandAdd')}</p>`;
  }
  return html + `<p>${btn('Cancel','rosCandClose')}</p></div>`;
}

/* =====================================================================
   ManagerDashboardPage  (UC-10 workload, UC-11 utilisation)

function pgDash(sub){
  const util = sub==='utilisation', Dd = UI.dash, weeks = [HIST[2],CUR,...PLAN];
  const head = pageHead('Manager Dashboard','ManagerDashboardPage','UC-10 Review Staff Workload (FR-19, FR-26) · UC-11 View Ambulance Utilisation (FR-20, FR-21, FR-22)') +
    `<div class="tabs"><a href="#/manager/dashboard" class="${util?'':'on'}">Staff workload</a><a href="#/manager/dashboard/utilisation" class="${util?'on':''}">Ambulance utilisation</a></div>`;
  const wkOpt = sel => weeks.map(x => opt(x, weekLbl(x)+(x===CUR?' (current week)':'')+' – '+(S.rosters[x]?S.rosters[x].status:'no roster yet'), x===sel)).join('');
  const staff = S.users.filter(u => u.type==='staff');
  const bar = (h,max) => `<span class="hbar ${h>MAX_HOURS&&max===72?'o':''}" style="width:${Math.round(Math.min(h/max,1)*160)}px"></span>`;

  if(!util && Dd.monthly){
    const rows = staff.map(u => ({u,h:hoursMonth(u.id,Dd.month,false)})).filter(x => x.u.status==='active' || x.h>0).sort((a,b) => b.h-a.h || a.u.name.localeCompare(b.u.name));
    const max = Math.max(1,...rows.map(x=>x.h));
    return head + `<div class="bar">${btn('Weekly view','dashWeekly')}${btn('Monthly view','dashMonthly',{},'pri')}<label>Calendar month: <select data-chg="dashMonth">${['2026-10','2026-11','2026-12'].map(m => opt(m,monthLbl(m),m===Dd.month)).join('')}</select></label></div>
      <h3>Total assigned hours per staff member – ${monthLbl(Dd.month)}</h3>
      <div class="scroll" style="max-height:560px"><table class="t"><tr><th>Staff member</th><th>Staff ID</th><th>Role qualification(s)</th><th>Assigned hours (calendar month)</th></tr>
      ${rows.map(x => `<tr><td>${esc(x.u.name)}</td><td>${x.u.id}</td><td>${esc(qual(x.u))}</td><td><b>${x.h} h</b> ${bar(x.h,max)}</td></tr>`).join('')}</table></div>
      <p class="sm">Totals include assignments in draft rosters, which only managers can see. A staff member's own monthly total (My Roster) counts published assignments only.</p>`;
  }
  if(!util){
    const w = Dd.week, rows = staff.map(u => ({u,h:hoursWeek(u.id,w)})).filter(x => x.u.status==='active' || x.h>0);
    const asc = rows.filter(x => x.u.status==='active').sort((a,b) => a.h-b.h || a.u.name.localeCompare(b.u.name));
    const third = asc[Math.min(2,asc.length-1)].h, low = asc.filter(x => x.h<=third), tied = low.filter(x => x.h===third).length;
    const over = rows.filter(x => x.h>MAX_HOURS);
    const desc = [...rows].sort((a,b) => b.h-a.h || a.u.name.localeCompare(b.u.name));
    return head + `<div class="bar">${btn('Weekly view','dashWeekly',{},'pri')}${btn('Monthly view','dashMonthly')}<label>Roster week: <select data-chg="dashWeek">${wkOpt(w)}</select></label></div>
      <div class="cols"><div class="box"><h2>Lowest workload this roster week</h2>
        <table class="t"><tr><th>#</th><th>Staff member</th><th>Role qualification(s)</th><th>Assigned hours</th></tr>
        ${low.map((x,i) => `<tr><td>${i+1}</td><td>${esc(x.u.name)} <small>${x.u.id}</small></td><td>${esc(qual(x.u))}</td><td><b>${x.h} h</b></td></tr>`).join('')}</table>
        ${low.length>3 ? `<p class="sm"><b>${low.length} staff shown:</b> ${tied} staff are tied at ${third} h, the third-lowest value, so all staff tied at that value are included.</p>` : '<p class="sm">The three staff members with the lowest assigned hours.</p>'}</div>
      <div class="box"><h2>Over ${MAX_HOURS} hours this roster week</h2><p style="font-size:26px;margin:0"><b>${over.length}</b> <small>of ${rows.length} staff</small></p>
        <p class="sm">Staff whose assigned hours exceed ${MAX_HOURS} h are highlighted in the table below. One shift counts as 12 hours.</p>
        ${S.rosters[w] ? '' : '<p class="sm"><b>No roster has been created for this week yet.</b></p>'}</div></div>
      <h3>Assigned hours per staff member – roster week ${weekLbl(w)}</h3>
      <div class="scroll" style="max-height:520px"><table class="t"><tr><th>Staff member</th><th>Staff ID</th><th>Role qualification(s)</th><th>Assigned hours (roster week)</th><th>Flag</th></tr>
      ${desc.map(x => `<tr class="${x.h>MAX_HOURS?'over':''}"><td>${esc(x.u.name)}</td><td>${x.u.id}</td><td>${esc(qual(x.u))}</td><td><b>${x.h} h</b> ${bar(x.h,72)}</td><td>${x.h>MAX_HOURS?tag('OVER 40 H','red'):''}</td></tr>`).join('')}</table></div>`;
  }
  // utilisation
  const w = Dd.uWeek, r = S.rosters[w], shifts = weekShifts(w).filter(sh => !Dd.uDay || sDate(sh)===Dd.uDay);
  const slots = r ? r.slots.filter(s => shifts.includes(s.shiftId)) : [];

    return `<tr class="${a.status!=='active'?'muted':''}"><td>${a.no}</td><td>${a.status==='active'?'Active':'Deactivated'}</td><td>${n}</td><td>${hrs} h</td><td>${total} h</td><td><b>${pct.toFixed(1)}%</b> <span class="hbar" style="width:${Math.round(pct*1.4)}px"></span></td></tr>`; }).join('');
  const fleetRows = shifts.map(sh => { const n = new Set(slots.filter(s => s.shiftId===sh && s.amb).map(s => s.amb)).size; return `<tr><td>${sLbl(sh)}</td><td>${n}</td><td>${active}</td><td><b>${active ? (n/active*100).toFixed(1) : '0.0'}%</b></td></tr>`; }).join('');
  const need = slots.filter(s => missing(s).length);
  return head + `<div class="bar"><label>Roster week: <select data-chg="utilWeek">${wkOpt(w)}</select></label>
      <label>Day: <select data-chg="utilDay">${opt('','Whole week',!Dd.uDay)}${[0,1,2,3,4,5,6].map(i => opt(addDays(w,i),fmtD(addDays(w,i)),Dd.uDay===addDays(w,i))).join('')}</select></label>
      <span class="sm">Period: ${Dd.uDay ? fmtD(Dd.uDay) : weekLbl(w)} · ${shifts.length} shifts</span></div>
    ${r ? '' : '<div class="note">No roster has been created for this week yet.</div>'}
    <div class="cols"><div class="box"><h2>Scheduled utilisation per ambulance</h2>
      <table class="t"><tr><th>Ambulance</th><th>Status</th><th>Rostered shifts</th><th>Scheduled in-service hours</th><th>Total shift hours</th><th>Utilisation</th></tr>${ambRows}</table>
      <p class="sm">Utilisation = scheduled in-service hours ÷ total shift hours in the period, counting at most 11 in-service hours for each rostered 12-hour shift.</p></div>
    <div class="box"><h2>Fleet utilisation per shift</h2><div class="scroll" style="max-height:480px"><table class="t"><tr><th>Roster shift</th><th>Rostered ambulances</th><th>Active fleet size</th><th>Fleet utilisation</th></tr>${fleetRows}</table></div>
      <p class="sm">Fleet utilisation = rostered ambulances ÷ active fleet size.</p></div></div>
    <div class="box"><h2>Roster slots requiring manpower</h2>
    ${need.length ? `<div class="scroll" style="max-height:300px"><table class="t"><tr><th>Roster shift</th><th>Slot</th><th>Ambulance</th><th>Missing role(s)</th><th>Staff required</th><th></th></tr>
      ${need.map(s => `<tr><td>${sLbl(s.shiftId)}</td><td>${slotNo(s)}</td><td>${s.amb||'not selected'}</td><td>${missTxt(s)}</td><td>${missing(s).length}</td><td>${btn('Open in Roster Management','rosOpen',{slot:s.id})}</td></tr>`).join('')}</table></div>`
      : `<div class="flash ok" style="margin:0"><b>✓</b> All roster slots in the selected period are fully staffed.</div>`}</div>`;
}

function adjSlot(slot,d){ const g = gIdx(slot.shiftId)+d; for(const r of Object.values(S.rosters)){ if(r.status!=='published') continue; const s = r.slots.find(x => x.amb===slot.amb && gIdx(x.shiftId)===g); if(s) return s; } return null; }

function pgStaffRoster(){

}

function pgMonthly(){
  const id = UI.staffId, ym = UI.mon.month, first = parse(ym+'-01');
  const mine = {}; staffAsgs(id).filter(x => x.roster.status==='published' && x.asg.status==='confirmed' && x.slot.shiftId.startsWith(ym)).forEach(x => (mine[sDate(x.slot.shiftId)]||(mine[sDate(x.slot.shiftId)]=[])).push(x));
  const count = Object.values(mine).reduce((n,v) => n+v.length, 0);
  let d = addDays(ym+'-01', -((first.getDay()+6)%7)), rows = '';
  for(let wk=0; wk<6; wk++){ let tds = '';
    for(let i=0;i<7;i++){ const out = !d.startsWith(ym);
      tds += `<td class="${out?'out':''}"><b>${parse(d).getDate()}</b>${out ? '' : (mine[d]||[]).sort((a,b)=>gIdx(a.slot.shiftId)-gIdx(b.slot.shiftId)).map(x => `<div class="s">${sName(x.slot.shiftId)} ${sTimes(x.slot.shiftId)}<br>${x.slot.amb} · ${x.asg.roles.map(r=>ROLES[r]).join(' + ')}</div>`).join('')}</td>`;
      d = addDays(d,1); }
    rows += `<tr>${tds}</tr>`; if(!d.startsWith(ym) && wk>=3) break; }
  return pageHead('Monthly Assignments','MonthlyAssignmentView','UC-09 View Own Roster – monthly assignment view (FR-25, NFR-08)') +
    `<div class="bar"><label>Calendar month: <select data-chg="monMonth">${['2026-10','2026-11','2026-12'].map(m => opt(m,monthLbl(m),m===ym)).join('')}</select></label>
      <span class="sp"></span><span class="box" style="margin:0;padding:4px 10px">Total assigned hours – ${monthLbl(ym)}: <b>${count*12} h</b> (${count} shifts)</span>
      <a class="btn" href="#/staff/roster" style="text-decoration:none">Back to weekly roster</a></div>
    ${count ? '' : '<div class="note"><b>You have no assigned shifts in this month.</b></div>'}
    <table class="cal"><tr>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x => `<th>${x}</th>`).join('')}</tr>${rows}</table>
    <p class="sm">Only your own assigned shifts are shown; the full team roster is not displayed. Station for all shifts: ${STATION}.</p>`;
}

/* ----- UC-02 Manage Availability / UC-03 Set Job Preference ----- */
CHG.avToggle = ({sh},el) => { const d = planDraft(); if(el.checked) d[sh] = true; else delete d[sh]; };

ACT.avSubmit = () => {
  const id = UI.staffId, d = planDraft(), saved = S.avail[id] || (S.avail[id] = {}), changed = [], late = [], kept = [];
  // FR-04 / UC-02 step 6: published assignments the staff member holds are never modified by an availability change
  const mine = new Set(staffAsgs(id).filter(x => x.roster.status==='published' && x.asg.status==='confirmed').map(x => x.slot.shiftId));
  PLAN.forEach(w => { const sh = weekShifts(w), diff = sh.filter(x => !!d[x] !== !!saved[x]); if(!diff.length) return;
    const before = sh.filter(x => saved[x]).length; diff.forEach(x => { if(d[x]) saved[x] = true; else { delete saved[x]; if(mine.has(x)) kept.push(x); } });
    changed.push(w); const lt = isLate(w); if(lt){ late.push(w); (S.late[id]||(S.late[id]={}))[w] = true; }
    audit('Availability '+(lt?'changed after cut-off (flagged late)':'submitted')+', week '+weekLbl(w), before+' shift(s) available', sh.filter(x => saved[x]).length+' shift(s) available'); });
  UI.plan.draft = null;
  if(!changed.length){ flash('info','No changes to submit. Your saved availability is unchanged.'); return render(); }
  const keptTxt = kept.length ? ` You are <b>still assigned</b> to ${kept.map(sLbl).join(', ')}: changing availability does not change a published assignment. Only a manager can amend the roster.` : '';
  if(late.length){
    sms(MGR,'Late availability',`${uname(id)} (${id}) submitted or changed availability after the Wednesday cut-off for week ${late.map(weekLbl).join(', ')}. Flagged as late for your consideration.${kept.length ? ` They are no longer available for ${kept.map(sLbl).join(', ')} but remain assigned.` : ''} No published assignment was changed.`);
    flash('warn',`Your availability has been saved and is visible to managers. <b>Week ${late.map(weekLbl).join(', ')}</b> was submitted or changed after the Wednesday cut-off, so it has been <b>flagged as late</b> and your manager has been notified to consider it case by case.${keptTxt || ' Published assignments are not changed.'}`);
  } else flash('ok',`Your availability has been saved for ${changed.length} roster week(s) and is visible to managers.${keptTxt || ' No published assignment was changed.'}`);
  render();
};

function openCand(mode,slotId,pos,replace){

function afterValid(){ const c = UI.ros.cand;
  if(c.mode==='reassign'){ const {slot} = slotById(c.slotId), old = slot.asg.find(a => a.id===c.replace);
    UI.modal = {title:'Reason for change', html:`<p>Reassign <b>${ROLES[c.role]}</b>, Slot ${slotNo(slot)} (${slot.amb}), ${sLbl(slot.shiftId)}<br>from <b>${esc(uname(old.staffId))}</b> to <b>${esc(uname(c.pending.id))}</b>.</p>`, reason:'Reason for the change (required)', ctx:'reassign', btns:[{l:'Save change',act:'rosReasonOk',pri:1},{l:'Cancel',act:'modalClose'}]}; return render(); }
  commit();
}
ACT.rosReasonOk = () => { const m = UI.modal, reason = $('#m-reason').value.trim();
  if(!reason){ m.err = 'A reason is required before the change can be saved.'; m.val = ''; return render(); }
  UI.modal = null; if(m.ctx==='reassign') commit(reason); else removePub(m.slot,m.asg,reason); };
function commit(reason){
  const c = UI.ros.cand, {slot} = slotById(c.slotId), u = user(c.pending.id), roleTxt = c.pending.roles.map(r=>ROLES[r]).join(' + ');
  const where = `${sLbl(slot.shiftId)}, Slot ${slotNo(slot)} (${slot.amb||c.amb})`;
  let old = null; if(c.replace){ old = slot.asg.find(a => a.id===c.replace); slot.asg = slot.asg.filter(a => a!==old); }
  if(!slot.amb) slot.amb = c.amb;
  slot.asg.push({id:nid('AS'), staffId:u.id, roles:c.pending.roles, status:c.mode==='standby'?'pending':'confirmed'});
  if(c.mode==='build'){
    audit(old?'Draft assignment replaced':'Draft assignment saved', old ? uname(old.staffId)+' – '+where : 'Role unassigned – '+where, `${u.name} – ${roleTxt}, ${where}`);
    flash('ok',`<b>${esc(u.name)}</b> assigned as ${roleTxt}, ${where}${old?' (replacing '+esc(uname(old.staffId))+')':''}. The roster slot has been updated and the change recorded in the audit log.`);
  } else if(c.mode==='reassign'){
    audit('Published assignment reassigned', `${uname(old.staffId)} – ${ROLES[c.role]}, ${where}`, `${u.name} – ${roleTxt}, ${where}`, reason);
    sms(old.staffId,'Roster amended',`Your assignment has changed: you are no longer assigned as ${ROLES[c.role]}, ${where}. Reason: ${reason}`);
    sms(u.id,'Roster amended',`You have been assigned as ${roleTxt}, ${where}, ${sTimes(slot.shiftId)}, ${STATION}. Reason: ${reason}`);
    flash('ok',`Assignment changed from <b>${esc(uname(old.staffId))}</b> to <b>${esc(u.name)}</b> (${roleTxt}, ${where}). The previous value, new value, acting user, time and reason have been recorded in the audit log, and both staff members have been notified by SMS.`);
  } else {
    audit('Standby replacement requested (pending confirmation)', 'Role unassigned – '+where, `${u.name} – ${roleTxt}, ${where}`);
    sms(u.id,'Replacement offer',`You have been selected as standby replacement: ${roleTxt}, ${where}, ${sTimes(slot.shiftId)}, ${STATION}. Please confirm or decline in the system.`);
    flash('ok',`A confirmation request has been sent by SMS to <b>${esc(u.name)}</b>. The role is shown as <b>awaiting confirmation</b>; the vacancy is not marked as filled until the staff member confirms.`);
  }
  UI.ros.cand = null; render();
}

/* ---------- figure highlight (screenshots only, not part of the system) ----------
   A scenario step may name what it produces in `hl`: the message, dialog, panel or row that appears.
   In ?shot= mode those parts are outlined so each report figure shows at a glance what the step did.
   A target is a CSS selector, a function returning element(s), or {union:target} for one outline around a group. */
const uniq = a => [...new Set([].concat(a).filter(Boolean))];
const HL = {
  modal: () => $$('#modal .mbox'),
  flash: () => $$('#main .flash'),
  box: t => () => $$('#main .box').filter(b => { const h = b.querySelector('h2'); return h && h.textContent.startsWith(t); }),
  note: t => () => $$('#main .note').filter(n => n.textContent.includes(t)),
  card: t => () => $$('#main .card').filter(c => c.textContent.includes(t)),
  row: t => () => $$('#main tr').filter(r => r.cells[0] && r.cells[0].tagName==='TD' && r.cells[0].textContent.trim().startsWith(t)),
  rowOf: sel => () => $$(sel).map(e => e.closest('tr')),
  tagRow: t => () => $$('#main .box .tag').filter(e => e.textContent===t).map(e => e.closest('tr')),
  pos: i => () => { const b = HL.box('Slot ')()[0]; return b ? b.querySelectorAll('table.t tr')[i+1] : null; }
};
function hlEls(t){ return uniq(typeof t==='function' ? t() : $$(t)); }
function highlight(targets){
  $$('.hl').forEach(e => e.remove());
  const groups = [], missing = [];
  [].concat(targets||[]).forEach((t,i) => { const els = hlEls(t && t.union ? t.union : t); if(!els.length) return missing.push(i); if(t.union) groups.push(els); else els.forEach(e => groups.push([e])); });
  groups.flat().forEach(e => { const sc = e.closest('.scroll'); if(!sc) return;          // bring a row inside a scrolling list into view
    const r = e.getBoundingClientRect(), s = sc.getBoundingClientRect(); sc.scrollTop += r.top - s.top - (sc.clientHeight - r.height)/2; });
  groups.forEach(g => { let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
    g.forEach(e => { const r = e.getBoundingClientRect(); x1 = Math.min(x1,r.left); y1 = Math.min(y1,r.top); x2 = Math.max(x2,r.right); y2 = Math.max(y2,r.bottom); });
    const sc = g[0].closest('.scroll'); if(sc){ const s = sc.getBoundingClientRect(); y1 = Math.max(y1,s.top); y2 = Math.min(y2,s.bottom); }
    const pad = g.length===1 && /^(TR|TD)$/.test(g[0].tagName) ? 1 : 4, d = document.createElement('div'); d.className = 'hl';
    d.style.cssText = `left:${x1+scrollX-pad-4}px;top:${y1+scrollY-pad-4}px;width:${x2-x1+2*pad+8}px;height:${y2-y1+2*pad+8}px`; document.body.appendChild(d); });
  return missing;
}

function runScenario(id,upTo){ const sc = SC.find(x => x.id===id); seed(); const dr = UI ? UI.drawer : null; UI = freshUI(); UI.drawer = dr; UI.sc = id; UI.scStep = 0;
  for(let i=0;i<=upTo && i<sc.steps.length;i++){ UI.flash = null; sc.steps[i].f(); UI.scStep = i; } render(); }
ACT.scStart = ({id}) => { try{ runScenario(id,0); }catch(e){ console.error(e); flash('err','Scenario could not start: '+esc(e.message)); render(); } };
ACT.scNext = ({id}) => { const sc = SC.find(x => x.id===id); if(UI.sc!==id) return ACT.scStart({id}); if(UI.scStep >= sc.steps.length-1) return render();
  try{ sc.steps[UI.scStep+1].f(); UI.scStep++; }catch(e){ console.error(e); flash('err','This step needs the scenario to be restarted (press Start). '+esc(e.message)); } render(); };

function drawerHtml(){
  const d = UI.drawer; if(!d) return '';
  const close = `<p style="float:right;margin:0">${btn('Close ✕','drawer',{d})}</p>`;
  if(d==='sms') return close + `<h2>SMS Service outbox (simulated)</h2><p class="sm">Messages the system has handed to the external SMS Service. Not a page of the system.</p>
    ${S.sms.map(m => `<div class="msg"><b>${esc(m.topic)}</b> → ${esc(m.name)} <small>${esc(m.contact)} · ${esc(m.t)}</small><br>${esc(m.text)}<br>${btn('View as recipient','smsView',{to:m.to})}</div>`).join('') || '<i>No messages.</i>'}`;
  if(d==='audit') return close + `<h2>Audit log (simulated)</h2><p class="sm">Entries recorded by the system (NFR-07). Not a page of the system.</p>
    ${S.audit.map(a => `<div class="msg"><b>${esc(a.action)}</b><br><small>${esc(a.t)} · ${esc(a.who)}</small><br>Previous: ${esc(a.prev)}<br>New: ${esc(a.next)}${a.reason!=='—' ? '<br>Reason: '+esc(a.reason) : ''}</div>`).join('') || '<i>No entries.</i>'}`;
  let html = close + `<h2>Scenario guide</h2><p class="sm"><b>Start</b> resets the demo data and jumps to the first step of a scenario; <b>Next step</b> performs the following step for you. You can also click through the pages yourself at any time.</p>`, last = '';
  SC.forEach(sc => { if(sc.uc!==last){ html += `<div class="uc">${sc.uc}</div>`; last = sc.uc; }
    const on = UI.sc===sc.id, done = on && UI.scStep >= sc.steps.length-1;
    html += `<div class="sc ${on?'on':''}">${tag(sc.k, sc.k.startsWith('Main')?'dark':'')} ${esc(sc.t)}<br>${btn('Start','scStart',{id:sc.id})}${on ? btn(done?'Finished':'Next step ▸','scNext',{id:sc.id},'pri',done)+` <small>step ${UI.scStep+1} of ${sc.steps.length}</small><div class="cap">${esc(sc.steps[UI.scStep].c)}</div>` : ''}</div>`; });
  return html;
}

/* ---------- boot ---------- */
seed(); UI = freshUI();
(function boot(){
  const q = new URLSearchParams(location.search);
  if(q.get('selftest')){ const out = [];
    SC.forEach(sc => { for(let i=0;i<sc.steps.length;i++){ try{ runScenario(sc.id,i); const m = $('#main').textContent; if(/undefined|NaN|\[object/.test(m)) out.push(sc.id+' step '+(i+1)+': suspicious text');
      if(highlight(sc.steps[i].hl).length) out.push(sc.id+' step '+(i+1)+': highlight target not found'); highlight(); }catch(e){ out.push(sc.id+' step '+(i+1)+': '+e.message); break; } } });
    document.title = out.length ? 'SELFTEST FAIL' : 'SELFTEST OK';
    document.body.insertAdjacentHTML('beforeend','<pre id="selftest">'+esc(out.length ? out.join('\n') : 'ALL '+SC.length+' SCENARIOS OK')+'</pre>'); return; }
  if(q.get('shot')){ document.body.classList.add('shot'); const step = +(q.get('step')||0); runScenario(q.get('shot'), step);
    if(q.get('hl')!=='0') highlight((SC.find(x => x.id===q.get('shot')).steps[step]||{}).hl);   // add &hl=0 for a plain screenshot
    const mb = $('#modal .mbox'); document.documentElement.dataset.h = Math.ceil(Math.max($('#app').getBoundingClientRect().bottom, mb ? mb.getBoundingClientRect().bottom+40 : 0) + window.scrollY + 14); return; }
  if(!location.hash) location.hash = '#/manager/dashboard';
